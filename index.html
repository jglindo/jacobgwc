<!DOCTYPE html>
<html>
<head>
    <title>p5.js Particle Background</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #text {
            position: absolute;
            z-index: 1;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="text">Jacob's Website</div>
    <script>
        let particles = [];

        function setup() {
            createCanvas(windowWidth, windowHeight);
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
        }

        function draw() {
            background(0);
            for (let particle of particles) {
                particle.update();
                particle.show();
            }
        }

        class Particle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(random(-2, 2), random(-2, 2));
                this.size = random(5, 10);
            }

            update() {
                this.pos.add(this.vel);
                if (this.pos.x > width || this.pos.x < 0) {
                    this.vel.x *= -1;
                }
                if (this.pos.y > height || this.pos.y < 0) {
                    this.vel.y *= -1;
                }
            }

            show() {
                noStroke();
                fill(255);
                ellipse(this.pos.x, this.pos.y, this.size);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
        {
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girls Who Code Club Purpose Statement</title>
    <style>
        .purpose-statement {
            color: pink;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="purpose-statement">
        <p>The Girls Who Code Club at [Your High School's Name] aims to empower young women by fostering a supportive and inclusive environment where they can explore and develop their skills in computer science and technology. Our mission is to inspire and equip girls with the confidence and technical expertise to pursue careers in STEM fields, break down gender barriers, and become leaders in the tech industry. Through collaborative projects, mentorship, and hands-on learning experiences, we strive to create a community that celebrates diversity, encourages innovation, and promotes lifelong learning.</p>
    </div>
    </script>
</body>
</html>
}
